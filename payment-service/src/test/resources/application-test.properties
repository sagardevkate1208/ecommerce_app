# TEST profile: used by the automated tests. In-memory H2, so no MySQL server is needed.
spring.datasource.url=jdbc:h2:mem:payment-servicetest;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
app.jwt.secret=test-secret-test-secret-test-secret-1234
app.order.base-url=http://localhost:0
app.internal.api-key=test-internal-key

# Razorpay is switched on in tests so its code stays covered. Fake values: nothing calls the real Razorpay.
razorpay.enabled=true
razorpay.base-url=https://razorpay.invalid/v1
razorpay.key-id=rzp_test_key
razorpay.key-secret=test_key_secret
razorpay.webhook-secret=test_webhook_secret
