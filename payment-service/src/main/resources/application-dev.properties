# DEV profile: your own machine. MySQL on localhost, verbose logging, SQL printed, test-mode payments.
# Every value can be overridden with an environment variable.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecommerce_payment?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Saggyy@7890}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
logging.level.com.ecommerce=DEBUG
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-32-chars-min}
app.order.base-url=${ORDER_URL:http://localhost:8084}
app.internal.api-key=${INTERNAL_API_KEY:dev-only-internal-key-change-me}

# Razorpay is switched OFF by default: only the mock gateway is used. To try Razorpay, set RAZORPAY_ENABLED=true
# and the keys below.
razorpay.enabled=${RAZORPAY_ENABLED:false}

# Razorpay TEST-mode keys (Dashboard > Settings > API Keys, with the dashboard switched to "Test Mode").
# Leave empty to run without Razorpay: use the "mock" payment option instead. Never put LIVE keys in a file.
razorpay.base-url=https://api.razorpay.com/v1
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
# Only needed to receive webhooks (set the same secret in Dashboard > Settings > Webhooks).
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
