spring.application.name=order-service
server.port=8084

# The environment is chosen with SPRING_PROFILES_ACTIVE=dev|prod. When it is not set, "dev" is used (see main()).
# Tests switch to the "test" profile themselves. Settings that differ per environment live in
# application-<profile>.properties.
Spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.jpa.open-in-view=false
