# PROD profile: no secret or address is written in this file. Every ${...} below has NO default on purpose, so the
# service refuses to start if an environment variable is missing, instead of running with a wrong value.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# The schema must already exist (create it by script or a migration tool). Hibernate only checks it matches.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
logging.level.root=WARN
logging.level.com.ecommerce=INFO
server.error.include-stacktrace=never
server.error.include-message=never
# Must be the same value in every service, and at least 32 characters.
app.jwt.secret=${JWT_SECRET}
app.catalog.base-url=${CATALOG_URL}
