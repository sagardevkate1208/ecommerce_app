# TEST profile: used by the automated tests. In-memory H2, so no MySQL server is needed.
spring.datasource.url=jdbc:h2:mem:auth-servicetest;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
app.jwt.secret=test-secret-test-secret-test-secret-1234
app.jwt.expiration-ms=3600000
